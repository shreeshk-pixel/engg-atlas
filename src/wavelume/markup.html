<canvas id="gl"></canvas>
<canvas id="c2d"></canvas>

<div id="start"><div class="card">
  <h1 id="brand">Wavelume</h1>
  <p>Open your songs, or let it listen to music playing around you.<br>Double-click / double-tap the visuals for fullscreen.</p>
  <button class="big" id="startOpen"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>Open songs</button><button class="big alt" id="startMic"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>Use microphone</button><br><button class="big alt" id="startInstall" style="display:none;margin:10px 0 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>Install the app</button>
</div></div>

<div id="toast"><div class="t1" id="t1"></div><div class="t2" id="t2"></div></div>

<div id="pl"></div>
<div id="srcmenu" class="menu">
  <button data-src="mic"><b>Microphone</b><span>Hears music playing around you</span></button>
  <button data-src="system" id="srcSys"><b>Tab / system audio</b><span>Captures sound from another tab or your computer (Chrome / Edge)</span></button>
  <button data-src="files"><b>Play my song files</b><span>MP3, M4A, WAV, FLAC…</span></button>
</div>

<div id="bar">
  <div id="seekrow"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
  <div id="ctrl">
    <button class="btn" id="open" title="Open songs"><svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg></button>
    <button class="btn" id="srcbtn" title="Live audio (M)"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
    <button class="btn" id="plbtn" title="Playlist"><svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-6v8.2A3 3 0 1 0 20 21v-9h3v-2h-5z"/></svg></button>
    <button class="btn" id="prev" title="Previous song"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="btn" id="play" title="Play / pause (Space)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="btn" id="next" title="Next song"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    <span id="title">No song loaded</span>
    <input id="vol" type="range" min="0" max="100" value="90" aria-label="Volume" style="--p:90%">
    <select id="viz" title="Visualization"></select>
    <button class="btn" id="vprev" title="Previous visual (←)"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
    <button class="btn" id="vnext" title="Next visual (→)"><svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
    <label class="tog hide-sm" title="Change visuals automatically"><input type="checkbox" id="auto" checked>Auto</label>
    <button class="btn" id="fs" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
  </div>
</div>


<div id="iosHint"><b>Install on your iPhone</b>Tap <svg width="16" height="16" viewBox="0 0 24 24" fill="#4fc3ff" style="vertical-align:-3px"><path d="M12 2l4 4h-3v9h-2V6H8l4-4zm-7 9h3v2H6v8h12v-8h-2v-2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V12a1 1 0 0 1 1-1z"/></svg> Share below, then <b style="display:inline">Add to Home Screen</b><button id="iosHintX" aria-label="Close">×</button></div>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.mp4,.wav,.flac,.ogg,.aac,.opus,.aif,.aiff,.caf" multiple hidden>
<audio id="audio" preload="auto" playsinline></audio>
